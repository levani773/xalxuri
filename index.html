    <script>
      // Suppress Vite dev HMR WebSocket connection notices in cloud iframe sandbox
      window.addEventListener('error', function(e) {
        if (e && (e.filename && e.filename.includes('@vite/client') || (e.message && e.message.includes('WebSocket')))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason.stack || '').includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
