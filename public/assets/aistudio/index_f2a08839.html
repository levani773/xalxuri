<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჭკვიანი ჩატბოტი (Smart JSON Chatbot)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
        /* Message fade-in effect */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        /* Pulse dots for typing indicator */
        .typing-dot {
            animation: typingPulse 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen overflow-hidden flex flex-col transition-colors duration-200">

    <!-- Top Navigation Header -->
    <header class="shrink-0 border-b border-slate-700/60 bg-slate-800/80 backdrop-blur z-20">
        <div class="max-w-4xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between">
            <!-- Brand Logo & Title -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid me-0 fa-robot text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight tracking-wide text-white">Smart Bot AI</h1>
                </div>
            </div>

            <!-- Header Actions -->
           
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="mainGrid" class="flex-1 min-h-0 max-w-4xl w-full mx-auto p-2 sm:p-3 flex flex-col">

        <!-- Chat Container (Left/Main Column) -->
        <section class="flex-1 min-h-0 flex flex-col bg-slate-800/90 rounded-2xl border border-slate-700/60 shadow-xl overflow-hidden relative">

            <!-- Chat Sub-header -->
            <div class="px-4 py-3 bg-slate-800/50 border-b border-slate-700/50 flex items-center justify-between text-xs sm:text-sm">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-slate-300 font-medium">ბოტი აქტიურია (ონლაინ)</span>
                </div>
                <button onclick="clearChat()" class="text-slate-400 hover:text-red-400 transition flex items-center space-x-1">
                    <i class="fa-solid fa-trash-can"></i>
                    <span class="hidden sm:inline">ისტორიის წაშლა</span>
                </button>
            </div>

            <!-- Messages Area -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Initial Bot Welcome Message -->
                <div class="flex items-start space-x-3 animate-fade-in">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shrink-0 mt-1 shadow-md">
                        <i class="fa-solid fa-robot text-sm"></i>
                    </div>
                    <div class="max-w-[85%] sm:max-w-[75%] bg-slate-700/70 border border-slate-600/40 rounded-2xl rounded-tl-none p-3.5 shadow-sm text-slate-100">
                        <p class="text-sm leading-relaxed">
                            გამარჯობა! 👋 მე ვარ ჭკვიანი ასისტენტი. რით შემიძლია დაგეხმაროთ?
                        </p>
                       
                        <span class="text-[10px] text-slate-400 block text-right mt-1.5" id="initTime"></span>
                    </div>
                </div>
            </div>



            <!-- Input Form Bar -->
            <div class="p-3 sm:p-4 bg-slate-800 border-t border-slate-700/60">
                <form id="chatForm" onsubmit="handleUserSubmit(event)" class="flex items-center space-x-2">
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelected(event)">
                    <button
                        type="button"
                        id="imageBtn"
                        onclick="document.getElementById('imageInput').click()"
                        title="სურათით ძებნა"
                        class="shrink-0 bg-slate-700/80 hover:bg-slate-600 text-indigo-300 w-11 h-11 rounded-xl transition flex items-center justify-center border border-slate-600/50"
                    >
                        <i class="fa-solid fa-camera"></i>
                    </button>
                    <input
                        type="text"
                        id="userInput"
                        placeholder="ჩაწერეთ კითხვა (მაგ: რა არის პითონი? რას აკეთებს კომპანია?)..."
                        class="flex-1 bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
                        autocomplete="off"
                    >
                    <button
                        type="submit"
                        id="sendBtn"
                        class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium px-5 py-3 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/20 disabled:opacity-50"
                    >
                        <span>გაგზავნა</span>
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Modal Drawer for Mobile KB editing -->
    <div id="mobileKbModal" onclick="if(event.target===this) toggleKBModal()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="w-full max-w-md bg-slate-800 h-full flex flex-col shadow-2xl border-l border-slate-700">
            <div class="p-4 bg-slate-900 border-b border-slate-700 flex items-center justify-between">
                <h3 class="font-bold text-slate-100">JSON ცოდნის ბაზა</h3>
                <button onclick="toggleKBModal()" class="text-slate-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex-1 min-h-0 overflow-hidden" id="mobileModalBody">
        <!-- JSON Knowledge Base Panel (opens as a drawer) -->
        <section id="kbSection" class="flex flex-col h-full bg-slate-800/90 overflow-hidden">

            <!-- KB Header -->
            <div class="p-3.5 bg-slate-800 border-b border-slate-700/60 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-database text-indigo-400"></i>
                    <h2 class="font-bold text-sm text-slate-200">JSON ცოდნის ბაზა</h2>
                </div>
                <span id="itemCountBadge" class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full font-mono border border-indigo-500/30">0 Q&amp;A</span>
            </div>

            <!-- Tabs: View / Editor / Import-Export -->
            <div class="flex border-b border-slate-700/50 bg-slate-800/40 text-xs font-medium">
                <button onclick="switchKbTab('list')" id="tabList" class="flex-1 py-2.5 text-center text-indigo-400 border-b-2 border-indigo-500 transition">სია</button>
                <button onclick="switchKbTab('add')" id="tabAdd" class="flex-1 py-2.5 text-center text-slate-400 hover:text-slate-200 transition">+ დამატება</button>
                <button onclick="switchKbTab('raw')" id="tabRaw" class="flex-1 py-2.5 text-center text-slate-400 hover:text-slate-200 transition">RAW JSON</button>
            </div>

            <!-- Tab Content 1: Q&A List Viewer -->
            <div id="kbTabList" class="flex-1 flex flex-col p-3 overflow-hidden space-y-2">
                <input
                    type="text"
                    id="kbSearch"
                    oninput="renderKbList()"
                    placeholder="ძებნა ბაზაში..."
                    class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                >
                <div id="kbItemsContainer" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <!-- Dynamic Q&A list -->
                </div>
            </div>

            <!-- Tab Content 2: Add New Q&A Form -->
            <div id="kbTabAdd" class="flex-1 p-4 overflow-y-auto hidden space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">სათაური (პასუხის თავში გამოჩნდება, არასავალდებულო)</label>
                    <input type="text" id="newTitle" placeholder="მაგ: სიმაღლეში ზრდისთვის" class="w-full bg-slate-900/80 border border-slate-700 text-xs rounded-lg p-2.5 text-slate-100 focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">კატეგორია / თემა</label>
                    <input type="text" id="newCategory" placeholder="მაგ: ზოგადი, ტექნოლოგია" class="w-full bg-slate-900/80 border border-slate-700 text-xs rounded-lg p-2.5 text-slate-100 focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">საკვანძო სიტყვები (მძიმით გამოყოფილი)</label>
                    <input type="text" id="newKeywords" placeholder="მაგ: პითონი, python, პროგრამირება" class="w-full bg-slate-900/80 border border-slate-700 text-xs rounded-lg p-2.5 text-slate-100 focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">სავარაუდო კითხვები / ფრაზები</label>
                    <textarea id="newQuestions" rows="2" placeholder="ჩაწერეთ თითო კითხვა ახალ ხაზზე" class="w-full bg-slate-900/80 border border-slate-700 text-xs rounded-lg p-2.5 text-slate-100 focus:border-indigo-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">ბოტის პასუხი</label>
                    <textarea id="newAnswer" rows="3" placeholder="ჩაწერეთ დეტალური პასუხი..." class="w-full bg-slate-900/80 border border-slate-700 text-xs rounded-lg p-2.5 text-slate-100 focus:border-indigo-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">წყაროს ლინკი (არასავალდებულო)</label>
                    <input type="url" id="newSource" placeholder="https://..." class="w-full bg-slate-900/80 border border-slate-700 text-xs rounded-lg p-2.5 text-slate-100 focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">ლინკის წარწერა (არასავალდებულო)</label>
                    <input type="text" id="newSourceTitle" placeholder="მაგ: წიგნი „ხალხური მედიცინა“, გვ. 45" class="w-full bg-slate-900/80 border border-slate-700 text-xs rounded-lg p-2.5 text-slate-100 focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">საცნობარო სურათები (სურათით ძებნისთვის)</label>
                    <input type="file" id="newImages" accept="image/*" multiple class="text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer w-full">
                    <p class="text-[10px] text-slate-500 mt-1">რამდენიმე განსხვავებული კუთხის სურათი უკეთეს შედეგს იძლევა. ატვირთვას server.py სჭირდება.</p>
                </div>
                <button onclick="saveNewQaPair()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-xs transition shadow-md">
                    <i class="fa-solid fa-plus mr-1"></i> ბაზაში შენახვა
                </button>
            </div>

            <!-- Tab Content 3: Raw JSON Editor & Files -->
            <div id="kbTabRaw" class="flex-1 flex flex-col p-3 hidden space-y-2">
                <textarea id="rawJsonEditor" class="flex-1 bg-slate-950 border border-slate-800 text-emerald-400 font-mono text-[11px] p-2.5 rounded-lg focus:outline-none focus:border-indigo-500 resize-none" spellcheck="false"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyRawJson()" class="bg-indigo-600 hover:bg-indigo-500 text-white py-1.5 rounded text-xs font-medium transition">
                        <i class="fa-solid fa-check mr-1"></i> გამოყენება
                    </button>
                    <button onclick="exportJsonFile()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 py-1.5 rounded text-xs font-medium transition">
                        <i class="fa-solid fa-download mr-1"></i> ექსპორტი (.json)
                    </button>
                </div>
                <!-- File Upload -->
                <div class="border-t border-slate-700/60 pt-2">
                    <label class="block text-[11px] text-slate-400 mb-1">საკუთარი JSON ფაილის ატვირთვა:</label>
                    <input type="file" id="jsonFileInput" accept=".json" onchange="importJsonFile(event)" class="text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer w-full">
                </div>
            </div>

            <!-- Bottom Reset Action -->
            <div class="p-2.5 bg-slate-900/40 border-t border-slate-700/50 flex justify-between items-center text-xs">
                <button onclick="resetDefaultKB()" class="text-amber-400 hover:text-amber-300 text-[11px] flex items-center">
                    <i class="fa-solid fa-rotate-left mr-1"></i> საწყის ბაზაზე დაბრუნება
                </button>
            </div>

        </section>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
